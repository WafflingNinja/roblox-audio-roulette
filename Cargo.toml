[package]
name = "roblox-audio-roulette"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28.1"
reqwest = { version = "0.12.9", features = ["blocking", "json", "gzip"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
rusqlite = { version = "0.32.1", features = ["bundled"] }
rand = "0.8.5"
dirs = "5.0.1"

[profile.release]
opt-level = 2
